<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 128" role="img" aria-labelledby="title desc">
  <title id="title">Resin.Tools</title>
  <desc id="desc">Resin.Tools wordmark framed by green industrial brackets with a yellow resin pellet.</desc>
  <style>
    .word{fill:#657784}
    .bracket{fill:none;stroke:#689d6a;stroke-width:10;stroke-linecap:square;stroke-linejoin:miter}
    .pellet{fill:#fabd2f}
    .divider{fill:#d65d0e}
    @media (prefers-color-scheme:dark){.word{fill:#ebdbb2}}
  </style>
  <path class="bracket" d="M38 14H14v100h24M602 14h24v100h-24"/>
  <circle class="pellet" cx="42" cy="64" r="9"/>
  <g class="word">
    <text x="72" y="86" font-family="Arial Narrow,Roboto Condensed,Arial,sans-serif" font-size="70" font-weight="900" letter-spacing="-3">RESIN</text>
    <circle class="divider" cx="301" cy="80" r="6"/>
    <text x="316" y="86" textLength="252" lengthAdjust="spacingAndGlyphs" font-family="Arial Narrow,Roboto Condensed,Arial,sans-serif" font-size="70" font-weight="900" letter-spacing="-3">TOOLS</text>
  </g>
</svg>
