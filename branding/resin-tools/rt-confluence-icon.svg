<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-labelledby="title desc">
  <title id="title">Resin.Tools Confluence icon</title>
  <desc id="desc">Five colored resin streams circling a layered coextrusion die.</desc>
  <style>
    :root{--icon-core:#faf4ed;--icon-ink:#575279;--stream-1:#b4637a;--stream-2:#d7827e;--stream-3:#ea9d34;--stream-4:#907aa9;--stream-5:#56949f}
    @media(prefers-color-scheme:dark){:root{--icon-core:#191724;--icon-ink:#e0def4;--stream-1:#eb6f92;--stream-2:#f6c177;--stream-3:#ebbcba;--stream-4:#c4a7e7;--stream-5:#9ccfd8}}
    .s1{color:var(--stream-1)}.s2{color:var(--stream-2)}.s3{color:var(--stream-3)}.s4{color:var(--stream-4)}.s5{color:var(--stream-5)}
  </style>
  <defs>
