    <use class="s2" href="#channel" transform="rotate(72)"/>
    <use class="s3" href="#channel" transform="rotate(144)"/>
    <use class="s4" href="#channel" transform="rotate(216)"/>
    <use class="s5" href="#channel" transform="rotate(288)"/>
    <path d="M0-15 14.3-4.6 8.8 12.1H-8.8L-14.3-4.6Z" fill="var(--icon-core)" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
    <g fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
      <path d="m-7-3 7-3.3L7-3 0 .3Z"/>
      <path d="m-7 .5 7 3.3L7 .5M-7 4l7 3.3L7 4"/>
