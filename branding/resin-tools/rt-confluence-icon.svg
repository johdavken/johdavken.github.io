      <path d="M-19-14C-12-23 0-26 10-22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M-9-29C-3-31 3-31 9-29M24-20l3 3" fill="none" stroke="var(--icon-ink)" stroke-width=".7" opacity=".52"/>
    </g>
  </defs>
  <g id="fg" transform="translate(54 54)" color="var(--icon-ink)">
    <g fill="none" stroke="currentColor">
      <circle r="40" stroke-width=".65" opacity=".25"/>
      <path d="M0-38.5V-43M12.361-38.042l.556-1.712M23.511-32.361l1.058-1.456M32.361-23.511l1.456-1.058M38.042-12.361l1.712-.556M38.5 0H43M38.042 12.361l1.712.556M32.361 23.511l1.456 1.058M23.511 32.361l1.058 1.456M12.361 38.042l.556 1.712M0 38.5V43M-12.361 38.042l-.556 1.712M-23.511 32.361l-1.058 1.456M-32.361 23.511l-1.456 1.058M-38.042 12.361l-1.712.556M-38.5 0H-43M-38.042-12.361l-1.712-.556M-32.361-23.511l-1.456-1.058M-23.511-32.361l-1.058-1.456M-12.361-38.042l-.556-1.712" stroke-width=".65" opacity=".38"/>
      <path d="M0-38.5V-43M38.5 0H43M0 38.5V43M-38.5 0H-43" stroke-width="1" opacity=".72"/>
    </g>
