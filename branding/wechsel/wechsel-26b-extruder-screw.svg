<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Wechsel extruder screw logo, refined</title>
  <desc id="desc">Tall condensed Wechsel wordmark with a restrained horizontal extruder screw through its center.</desc>
  <rect width="1600" height="800" fill="#ebdbb2"/>

  <!-- Taller, tighter editable wordmark based on concept 26. -->
  <text x="800" y="590" fill="#282828"
        font-family="Open Sans Condensed, Nimbus Sans Narrow, Arial Narrow, sans-serif"
        font-size="500" font-weight="800" letter-spacing="-20" text-anchor="middle"
        transform="translate(800 0) scale(.68 1) translate(-800 0)">WECHSEL</text>

  <!-- Reduced screw: a center detail rather than the dominant silhouette. -->
  <g fill="#282828" stroke="#ebdbb2" stroke-width="7" stroke-linejoin="round">
    <!-- Compact drive and bearing -->
    <rect x="98" y="388" width="31" height="34" stroke="none"/>
    <rect x="124" y="376" width="18" height="58"/>
    <path d="M138 365h49l23 22v36l-23 22h-49z"/>
    <path d="M151 380h37M151 395h37M151 410h37M151 425h37" fill="none" stroke-width="6"/>

    <!-- Slim shaft -->
    <rect x="202" y="391" width="1198" height="28"/>

    <!-- Low-profile helical flights -->
    <path d="M232 377h25l34 56h-25z"/>
    <path d="M320 377h25l34 56h-25z"/>
    <path d="M408 377h25l34 56h-25z"/>
    <path d="M496 377h25l34 56h-25z"/>
    <path d="M584 377h25l34 56h-25z"/>
    <path d="M672 377h25l34 56h-25z"/>
    <path d="M760 377h25l34 56h-25z"/>
    <path d="M848 377h25l34 56h-25z"/>
    <path d="M936 377h25l34 56h-25z"/>
    <path d="M1024 377h25l34 56h-25z"/>
    <path d="M1112 377h25l34 56h-25z"/>
    <path d="M1200 377h25l34 56h-25z"/>
    <path d="M1288 377h25l34 56h-25z"/>
    <path d="M1376 377h18l22 43h-20z"/>
  </g>

  <!-- Small breaker plate and die -->
  <rect x="1397" y="379" width="14" height="52" fill="#282828"/>
  <rect x="1428" y="362" width="28" height="86" rx="2" fill="#d65d0e"/>
  <circle cx="1442" cy="380" r="5" fill="#ebdbb2"/>
  <circle cx="1442" cy="430" r="5" fill="#ebdbb2"/>
</svg>
