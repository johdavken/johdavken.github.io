  <!-- Theme state restores before the first stylesheet can paint, so the
       standalone harness never flashes the default before a saved choice. -->
  <script src="../station-theme.js?v=0.2.0"></script>
  <script>
    if (globalThis.PolynStationTheme && typeof globalThis.PolynStationTheme.initialize === "function") {
      document.documentElement.stationTheme = globalThis.PolynStationTheme.initialize(document.documentElement, globalThis);
    } else {
      document.documentElement.setAttribute("data-theme", "industrial-dark");
    }
  </script>

  <!-- THE ISOLATED HARNESS.
       This page exists to develop and inspect Station's components with no
       application around them: the demo line configurations, chosen at
       ?demo=<id> (station-demo-lines.js), and ?source=demo. It is NOT how
       Station reaches live state -
       that is /?view=station in the real application, which runs the same
       renderer and the same shell builder as this page.

       Station loads NONE of the application's stylesheets. The legacy cascade
       is not inherited and then overridden, it is simply not present.
       station-isolation.test.js enforces this in both directions. -->

  <!-- Shared application modules, read as the source of truth for line facts.
       Station resolves layer count, Layer A's physical side, hopper naming
       and layer names through these rather than restating them. -->

  <script src="../line-identity.js?v=0.5.0" defer></script>
  <script src="../hookup-sources.js?v=0.1.0" defer></script>
  <!-- The application's own changeover reading (parseChangeoverDate,
       isChangeoverStale): the run-down timeline resolves the job's clock
       time through it, so Station and the floor UI agree on the day. -->
  <script src="../scheduling.js?v=0.18.4" defer></script>
  <!-- The application's changeover calculator as a module (its wizard's
       arithmetic and device-local records): what the Station Changeover
       Calculator runs. Shared, like scheduling.js. -->
  <script src="../changeover-estimate.js?v=0.1.1" defer></script>
  <!-- The application's Resin Totals arithmetic as a module: what the
       Handbook's Resin Totals page runs. Shared, like scheduling.js. -->
  <script src="../resin-totals.js?v=0.1.0" defer></script>
  <!-- The command contract and command bridge: the write direction's
       vocabulary and transport. Loaded so Station discovers commands the
       same way here as in the application host; nothing connects a producer
       on this page, so every command is answered "unavailable" and Station
       stays read-only. -->
  <script src="../station-command-contract.js?v=0.10.0" defer></script>
  <script src="../station-command-bridge.js?v=0.1.0" defer></script>
  <!-- The shared resin catalog, for the focused editor's resin search: the
       same list Recipe Setup offers, from the same service. On this page
       nothing is configured behind it, so it serves its built-in fallback. -->
  <script src="../resin-data.js?v=0.16.2" defer></script>
  <script src="../resin-catalog-service.js?v=0.19.1" defer></script>

  <!-- The read-only state bridge. Loaded so this page runs the same code path
       the application host does; nothing connects to it here, so Station falls
       back to the demo configurations. That is the fallback working. -->
  <script src="../station-state-bridge.js?v=0.6.0" defer></script>
  <!-- The line connection bridge: the application's RT Sync state and
       actions as Station may see them. Nothing connects a producer on this
       page, so the line console stays hidden here. -->
  <script src="../station-connection-bridge.js?v=0.1.0" defer></script>
  <!-- The saved-recipes bridge: the workspace's shared recipes as Station may
       see them, and the Recipe Book's save/replace/refresh as a letterbox.
       Nothing connects a producer on this page, so the Handbook's Recipe
       Book says so and offers nothing. -->
  <script src="../station-recipes-bridge.js?v=0.2.0" defer></script>
  <!-- The weight-profiles bridge: the workspace's shared Receiver Weight
       Profiles as Station may see them, and the Weights page's
       save/load/update/rename/duplicate/delete/refresh as a letterbox.
       Nothing connects a producer on this page, so the page says so. -->
  <script src="../station-weight-profiles-bridge.js?v=0.1.0" defer></script>

       Station may see them, and the admin actions as a letterbox. Nothing
       connects a producer on this page, so the Handbook's Sudo page says
       so and offers nothing. -->
  <script src="../station-admin-bridge.js?v=0.3.0" defer></script>
