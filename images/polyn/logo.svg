<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" role="img" aria-labelledby="title desc">
  <title id="title">Polyn</title>
  <desc id="desc">Five polymer streams converge through an extrusion die beside the Polyn wordmark.</desc>
  <!-- Flow Die symbol: layered resin streams converge into one extrusion path. -->
  <g fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path id="flow-red" d="M28 38h66l27 25h47" stroke="#cc241d"/>
    <path id="flow-orange" d="M28 57h57l27 15h56" stroke="#d65d0e"/>
    <path id="flow-yellow" d="M28 76h140" stroke="#d79921"/>
    <path id="flow-green" d="M28 95h57l27-15h56" stroke="#689d6a"/>
    <path id="flow-blue" d="M28 114h66l27-25h47" stroke="#458588"/>
  </g>
  <text id="polyn-wordmark" x="198" y="107" fill="#3c3836" font-family="ui-monospace, Cascadia Mono, Liberation Mono, monospace" font-size="76" font-weight="900" letter-spacing="-7">POLYN</text>
  <text id="polyn-tagline" x="202" y="130" fill="#665c54" font-family="ui-monospace, Cascadia Mono, Liberation Mono, monospace" font-size="17" font-weight="800" letter-spacing=".8">POLYMER INTELLIGENCE</text>
</svg>
