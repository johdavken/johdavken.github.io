<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resin.Tools RT Logo Concepts — Round 3</title><style>
:root{color-scheme:dark;--bg:#1d2021;--panel:#282828;--line:#504945;--text:#ebdbb2;--muted:#a89984;--accent:#d65d0e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}header{padding:28px clamp(18px,4vw,52px);border-bottom:1px solid var(--line)}h1{margin:0;font:900 clamp(28px,5vw,48px)/1 ui-monospace,monospace;letter-spacing:-.06em}header p{margin:8px 0 0;color:var(--muted)}main{max-width:1400px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.head{display:flex;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}.num{color:var(--accent);font-weight:900}.name{font-weight:850}.idea{margin-top:2px;color:var(--muted);font-size:12px}.views{display:grid;grid-template-columns:1fr 150px;min-height:180px}.large{display:grid;place-items:center;padding:28px;background:#fbf1c7}.rail{display:grid;place-items:center;padding:18px;background:#1d2021;border-left:1px solid var(--line)}.large img{width:min(250px,80%)}.rail img{width:70px}.label{position:absolute;margin:10px;color:#928374;font:800 10px ui-monospace,monospace;letter-spacing:.08em}.surface{position:relative}.pick{display:block;padding:10px 15px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.pick input{accent-color:var(--accent)}@media(max-width:760px){.grid{grid-template-columns:1fr}.views{grid-template-columns:1fr 110px}.rail img{width:54px}}
</style></head><body><header><h1>RESIN.TOOLS // RT — ROUND 3</h1><p>Round two was too boxy. Same legible R/T skeleton, rebuilt as rounded strokes — every corner and terminal is soft.</p></header><main><section class="grid" id="grid"></section></main><script>
const logos=[
['Round Duo','Two-tone rounded stroke R and T, no badge, most minimal.'],['Round Badge','Rounded-tile favicon badge, cream strokes, pellet accent.'],['Round Split','Teal/orange split field on a soft rounded-corner tile.'],['Thin Line','Lighter stroke weight — same shapes, more refined line.'],['Pill Underline','Dark rounded letters over a true pill-shaped accent bar.'],['Round Circle','Full circular badge, best fit for a compact favicon.'],['Dot Accent','Flat duo in one color with a bright pellet between letters.'],['Reversed Round','Knockout tile — rounded strokes cut through as negative space.']];
const grid=document.getElementById('grid');logos.forEach((x,i)=>{const n=String(i+1).padStart(2,'0'),file=`../branding/resin-tools/rt3-${n}-${['round-duo','round-badge','round-split','thin-line','pill-underline','round-circle','dot-accent','reversed-round'][i]}.svg`;grid.insertAdjacentHTML('beforeend',`<article class="card"><div class="head"><span class="num">${n}</span><div><div class="name">${x[0]}</div><div class="idea">${x[1]}</div></div></div><div class="views"><div class="surface large"><span class="label">LIGHT SURFACE</span><img src="${file}" alt="RT ${x[0]}"></div><div class="surface rail"><span class="label">SIDE RAIL</span><img src="${file}" alt="RT ${x[0]} small"></div></div><label class="pick"><input type="radio" name="pick"> Mark as favorite</label></article>`)});
</script></body></html>
