<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Polyn — Run-Down Timeline Card Comparison</title>
  <style>
    :root{color-scheme:light;--canvas:#eceff1;--panel:#fff;--panel2:#f7f7f6;--text:#29282b;--muted:#666269;--accent:#b3262e;--soft:rgba(179,38,46,.10);--line:rgba(74,73,72,.17);--field:rgba(74,73,72,.055);--ok:#16a34a;--warn:#d97706}
    html[data-theme="dark"]{color-scheme:dark;--canvas:#161b20;--panel:#282828;--panel2:#222524;--text:#ebdbb2;--muted:#bdae93;--accent:#83a598;--soft:rgba(131,165,152,.15);--line:rgba(235,219,178,.17);--field:rgba(235,219,178,.055);--ok:#8ec07c;--warn:#fabd2f}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}
    header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(18px,4vw,48px);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--canvas) 92%,transparent);backdrop-filter:blur(12px)}h1{margin:0;font-size:clamp(23px,3vw,34px)}header p{margin:3px 0 0;color:var(--muted)}.theme{padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);cursor:pointer}
    main{width:min(1500px,100%);margin:auto;padding:24px clamp(12px,3vw,34px) 50px}.intro{display:flex;justify-content:space-between;gap:16px;margin-bottom:20px;padding:14px 16px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--muted)}.chip{flex:none;align-self:center;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:10px;font-weight:850}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.concept{overflow:hidden;border:2px solid transparent;border-radius:16px;background:var(--panel)}.concept.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}.conceptHead{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.choice{display:flex;gap:9px;cursor:pointer}.choice input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}.name{font-size:16px;font-weight:850}.note{display:block;margin-top:2px;color:var(--muted);font-size:11px}.badge{align-self:flex-start;padding:4px 7px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:9px;font-weight:900;text-transform:uppercase;white-space:nowrap}
    .preview{display:grid;gap:8px;padding:14px;background:var(--panel2)}.timelineHead{display:flex;align-items:end;justify-content:space-between;margin-bottom:3px}.timelineHead strong{color:var(--accent)}.timelineHead span{color:var(--muted);font-size:10px}.row{position:relative}.hopper{font-weight:900}.resin{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.muted{color:var(--muted)}.time{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:900}.tag{display:inline-flex;padding:2px 6px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:9px}.pump{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:9px;white-space:nowrap}.pump input{width:14px;height:14px;margin:0;accent-color:var(--accent)}.meta{color:var(--muted);font-size:9px}.overdue .time{color:var(--warn)}.done{opacity:.43;filter:grayscale(1)}
    .current .row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px;border:1px solid var(--line);border-radius:12px;background:var(--field)}.current .identity{display:flex;gap:5px;flex-wrap:wrap}.current .identity>*{padding:2px 6px;border:1px solid var(--line);border-radius:999px;font-size:9px}.current .meta{margin-top:5px}.current .action{text-align:right}
    .rail{padding-left:17px}.rail::before{content:"";position:absolute;top:14px;bottom:14px;left:20px;width:1px;background:var(--line)}.rail .row{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;min-height:58px;padding:6px 7px}.rail .row::before{content:"";position:absolute;left:0;width:8px;height:8px;border:3px solid var(--panel2);border-radius:50%;background:var(--accent)}.rail .when{padding-left:12px}.rail .when small{display:block;color:var(--muted);font-size:8px}.rail .details{padding-bottom:5px;border-bottom:1px solid var(--line)}.rail .row:last-child .details{border-bottom:0}
    .strip .row{display:grid;grid-template-columns:52px minmax(80px,1fr) 64px 72px 72px auto;align-items:center;gap:8px;min-height:39px;padding:5px 8px;border-bottom:1px solid var(--line)}.strip .row:first-of-type{border-top:1px solid var(--line)}.strip .hopper{color:var(--accent)}.strip .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .priority .row{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;padding:8px 10px;border-left:3px solid var(--line);background:var(--field)}.priority .row:first-of-type{border-radius:8px 8px 0 0}.priority .row:last-child{border-radius:0 0 8px 8px}.priority .row+.row{border-top:1px solid var(--line)}.priority .row:first-of-type{border-left-color:var(--accent)}.priority .time{font-size:16px}.priority .when{color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.06em}
    .dividers .row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}.dividers .row:last-child{border-bottom:0}.dividers .identity{display:flex;align-items:baseline;gap:7px}.dividers .hopper{color:var(--accent)}.dividers .meta{margin-top:3px}.dividers .right{text-align:right}
    .command .row{display:grid;grid-template-columns:7px 48px 1fr auto;gap:9px;align-items:center;min-height:46px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}.command .signal{align-self:stretch;border-radius:4px;background:var(--line)}.command .row:first-of-type .signal{background:var(--accent)}.command .overdue .signal{background:var(--warn)}.command .done .signal{background:var(--ok)}.command .hopper{font-size:15px}.command .main{display:flex;align-items:baseline;gap:8px}.command .meta{margin-top:2px}
    @media(max-width:1050px){.grid{grid-template-columns:1fr}}@media(max-width:560px){header{align-items:flex-start}.intro{display:grid}.chip{justify-self:start}.strip .row{grid-template-columns:48px 1fr auto auto}.strip .rate,.strip .weight{display:none}.priority .row{grid-template-columns:74px 1fr}.priority .pump{grid-column:2}.command .row{grid-template-columns:6px 42px 1fr}.command .pump{grid-column:3}.rail .row{grid-template-columns:52px 1fr}.rail .pump{grid-column:2}.current .row{grid-template-columns:1fr}.current .action{text-align:left}.dividers .identity{flex-wrap:wrap}}
  </style>
</head>
<body>
  <header><div><h1>Run-Down Timeline study</h1><p>Sleeker alternatives to the current timeline cards.</p></div><button class="theme" id="themeButton" type="button">Preview dark</button></header>
  <main><div class="intro"><span>Every concept shows the same production information and pump-off action. Resize the page to compare mobile behavior.</span><span class="chip">Production UI unchanged</span></div><section class="grid" id="grid"></section></main>
  <script>
    "use strict";
    const rows=[
      {hopper:"A2",resin:"MS1201",time:"12:18 PM",remaining:"23 min",rate:"86.4 lb/hr",weight:"33 lb",cls:""},
      {hopper:"B1",resin:"MS0440",time:"12:31 PM",remaining:"36 min",rate:"152.2 lb/hr",weight:"57 lb",cls:""},
      {hopper:"C3",resin:"A0502",time:"Now",remaining:"Overdue 4 min",rate:"42.0 lb/hr",weight:"10 lb",cls:"overdue"},
      {hopper:"D4",resin:"MS0700B",time:"11:56 AM",remaining:"Pump off",rate:"68.7 lb/hr",weight:"25 lb",cls:"done"}
    ];
    const concepts=[
      {id:"current",name:"1. Current soft cards",note:"Present layout retained as the control.",css:"current"},
      {id:"rail",name:"2. Vertical event rail",note:"A chronological spine makes sequence immediately visible.",css:"rail",recommended:true},
      {id:"strip",name:"3. Precision data strips",note:"Table-like rows maximize density and quick comparison.",css:"strip"},
      {id:"priority",name:"4. Time-first priority lane",note:"Large action times lead each compact stacked row.",css:"priority"},
      {id:"dividers",name:"5. Borderless divided list",note:"Removes cards entirely and relies on quiet separators.",css:"dividers"},
      {id:"command",name:"6. Compact command rows",note:"Industrial status bars identify priority without bulky cards.",css:"command"}
    ];
    const pump=r=>`<label class="pump"><input type="checkbox" ${r.cls==="done"?"checked":""}>Pump off</label>`;
    function row(r,type){
      if(type==="current")return `<div class="row ${r.cls}"><div><div class="identity"><b>Layer ${r.hopper[0]}</b><b>${r.hopper}</b><span class="resin">${r.resin}</span><span>${r.weight}</span></div><div class="meta">Rate ${r.rate} · Time to empty ${r.remaining}</div></div><div class="action"><small class="muted">Start by</small><div class="time">${r.time}</div>${pump(r)}</div></div>`;
      if(type==="rail")return `<div class="row ${r.cls}"><div class="when"><small>START</small><span class="time">${r.time}</span></div><div class="details"><span class="hopper">${r.hopper}</span> · <span class="resin">${r.resin}</span><div class="meta">${r.remaining} · ${r.rate} · ${r.weight}</div></div>${pump(r)}</div>`;
      if(type==="strip")return `<div class="row ${r.cls}"><span class="hopper">${r.hopper}</span><span class="resin">${r.resin}</span><span class="rate meta">${r.rate}</span><span class="weight meta">${r.weight}</span><span class="time">${r.time}</span>${pump(r)}</div>`;
      if(type==="priority")return `<div class="row ${r.cls}"><div><div class="when">Start by</div><div class="time">${r.time}</div></div><div><span class="hopper">${r.hopper}</span> · <span class="resin">${r.resin}</span><div class="meta">${r.remaining} · ${r.rate} · ${r.weight}</div></div>${pump(r)}</div>`;
      if(type==="dividers")return `<div class="row ${r.cls}"><div><div class="identity"><span class="hopper">${r.hopper}</span><span class="resin">${r.resin}</span><span class="tag">${r.weight}</span></div><div class="meta">${r.remaining} · ${r.rate}</div></div><div class="right"><span class="time">${r.time}</span>${pump(r)}</div></div>`;
      return `<div class="row ${r.cls}"><span class="signal"></span><span class="hopper">${r.hopper}</span><div><div class="main"><span class="resin">${r.resin}</span><span class="time">${r.time}</span></div><div class="meta">${r.remaining} · ${r.rate} · ${r.weight}</div></div>${pump(r)}</div>`;
    }
    const grid=document.getElementById("grid");concepts.forEach(item=>{const card=document.createElement("article");card.className=`concept${item.recommended?" selected":""}`;card.dataset.concept=item.id;card.innerHTML=`<div class="conceptHead"><label class="choice"><input type="radio" name="favorite" value="${item.id}" ${item.recommended?"checked":""}><span><span class="name">${item.name}</span><span class="note">${item.note}</span></span></label>${item.recommended?'<span class="badge">Recommended</span>':""}</div><div class="preview ${item.css}"><div class="timelineHead"><strong>Run-Down Timeline</strong><span>Sorted by upcoming time</span></div>${rows.map(r=>row(r,item.css)).join("")}</div>`;grid.appendChild(card)});
    grid.addEventListener("change",event=>{if(event.target.matches('.pump input'))event.target.closest('.row').classList.toggle('done',event.target.checked)});
    document.querySelectorAll('input[name="favorite"]').forEach(input=>input.addEventListener("change",()=>document.querySelectorAll(".concept").forEach(card=>card.classList.toggle("selected",card.dataset.concept===input.value))));
    document.getElementById("themeButton").addEventListener("click",event=>{const dark=document.documentElement.dataset.theme!=="dark";document.documentElement.dataset.theme=dark?"dark":"light";event.currentTarget.textContent=dark?"Preview light":"Preview dark"});
  </script>
</body>
</html>
