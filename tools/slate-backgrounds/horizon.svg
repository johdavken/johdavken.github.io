<!-- A Slate background's source (render.js). Horizon, made for Retro 82:
     a synthwave dusk in the palette's navy, teal and orange - a striped
     sun sinking behind a perspective grid - softened so it reads as a
     glow behind the page, not a picture on it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#031222"/>
      <stop offset="0.45" stop-color="#0a2540"/>
      <stop offset="0.62" stop-color="#134e5a"/>
      <stop offset="0.62" stop-color="#05182e"/>
      <stop offset="1" stop-color="#020c17"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dcac"/>
      <stop offset="0.5" stop-color="#faa968"/>
      <stop offset="1" stop-color="#e97b3c"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#faa968" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#faa968" stop-opacity="0"/>
    </radialGradient>
    <mask id="cut">
      <rect width="1600" height="1000" fill="#fff"/>
      <g fill="#000"><rect x="540" y="452" width="520" height="5"/><rect x="540" y="486" width="520" height="8"/><rect x="540" y="520" width="520" height="11"/><rect x="540" y="556" width="520" height="14"/><rect x="540" y="594" width="520" height="17"/></g>
    </mask>
    <clipPath id="above"><rect width="1600" height="620"/></clipPath>
    <clipPath id="below"><rect y="620" width="1600" height="400"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="glowing"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <ellipse cx="800" cy="620" rx="1100" ry="520" fill="url(#haze)"/>
  <g clip-path="url(#above)" filter="url(#soft)">
    <circle cx="800" cy="520" r="250" fill="url(#sun)" mask="url(#cut)"/>
  </g>
  <g clip-path="url(#below)" stroke="#4cc3cd" stroke-width="2.4" opacity="0.8">
    <g filter="url(#glowing)" stroke-width="6" opacity="0.6"><line x1="-100" y1="623.5" x2="1700" y2="623.5"/><line x1="-100" y1="632.1" x2="1700" y2="632.1"/><line x1="-100" y1="645.2" x2="1700" y2="645.2"/><line x1="-100" y1="662.2" x2="1700" y2="662.2"/><line x1="-100" y1="683.1" x2="1700" y2="683.1"/><line x1="-100" y1="707.6" x2="1700" y2="707.6"/><line x1="-100" y1="735.6" x2="1700" y2="735.6"/><line x1="-100" y1="767.0" x2="1700" y2="767.0"/><line x1="-100" y1="801.8" x2="1700" y2="801.8"/><line x1="-100" y1="839.7" x2="1700" y2="839.7"/><line x1="-100" y1="880.8" x2="1700" y2="880.8"/><line x1="-100" y1="925.1" x2="1700" y2="925.1"/><line x1="30" y1="620" x2="-3820" y2="1100"/><line x1="85" y1="620" x2="-3490" y2="1100"/><line x1="140" y1="620" x2="-3160" y2="1100"/><line x1="195" y1="620" x2="-2830" y2="1100"/><line x1="250" y1="620" x2="-2500" y2="1100"/><line x1="305" y1="620" x2="-2170" y2="1100"/><line x1="360" y1="620" x2="-1840" y2="1100"/><line x1="415" y1="620" x2="-1510" y2="1100"/><line x1="470" y1="620" x2="-1180" y2="1100"/><line x1="525" y1="620" x2="-850" y2="1100"/><line x1="580" y1="620" x2="-520" y2="1100"/><line x1="635" y1="620" x2="-190" y2="1100"/><line x1="690" y1="620" x2="140" y2="1100"/><line x1="745" y1="620" x2="470" y2="1100"/><line x1="800" y1="620" x2="800" y2="1100"/><line x1="855" y1="620" x2="1130" y2="1100"/><line x1="910" y1="620" x2="1460" y2="1100"/><line x1="965" y1="620" x2="1790" y2="1100"/><line x1="1020" y1="620" x2="2120" y2="1100"/><line x1="1075" y1="620" x2="2450" y2="1100"/><line x1="1130" y1="620" x2="2780" y2="1100"/><line x1="1185" y1="620" x2="3110" y2="1100"/><line x1="1240" y1="620" x2="3440" y2="1100"/><line x1="1295" y1="620" x2="3770" y2="1100"/><line x1="1350" y1="620" x2="4100" y2="1100"/><line x1="1405" y1="620" x2="4430" y2="1100"/><line x1="1460" y1="620" x2="4760" y2="1100"/><line x1="1515" y1="620" x2="5090" y2="1100"/><line x1="1570" y1="620" x2="5420" y2="1100"/></g>
