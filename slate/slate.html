  <!-- Theme state restores before the first stylesheet can paint, so the
       standalone harness never flashes the default before a saved choice. -->
  <script src="../slate-theme.js?v=0.2.0"></script>
  <!-- The display preferences (read-only mode) restore with it. -->
  <script src="../slate-display.js?v=0.2.0"></script>
  <script>
    if (globalThis.PolynSlateTheme && typeof globalThis.PolynSlateTheme.initialize === "function") {
      document.documentElement.slateTheme = globalThis.PolynSlateTheme.initialize(document.documentElement, globalThis);
    } else {
      document.documentElement.setAttribute("data-theme", "yaru-light");
    }
    if (globalThis.PolynSlateDisplay && typeof globalThis.PolynSlateDisplay.initialize === "function") {
      document.documentElement.slateDisplay = globalThis.PolynSlateDisplay.initialize(document.documentElement, globalThis);
    }
  </script>

  <!-- THE ISOLATED HARNESS.
       This page exists to develop and inspect Slate's components with no
       application around them: the demo line (slate-demo.js) stands in
       for the state bridge's producer. It is NOT how Slate reaches live
       state - that is /?view=slate in the real application, which runs the
       same modules and the same shell builder as this page.

       Slate loads NONE of the application's stylesheets. The legacy cascade
       is not inherited and then overridden, it is simply not present. -->

  <!-- The application's own changeover reading (parseChangeoverDate,
       isChangeoverStale): the run-down resolves the job's clock time
       through it, so Slate and the floor UI agree on the day. -->
  <script src="../scheduling.js?v=0.18.4" defer></script>
  <!-- The command contract and command bridge: the write direction's
       vocabulary and transport. Nothing connects a producer on this page,
       so every command is answered "unavailable" and Slate stays read-only. -->
  <script src="../station-command-contract.js?v=0.11.0" defer></script>
  <script src="../station-command-bridge.js?v=0.1.0" defer></script>
  <!-- The read-only state bridge. Nothing connects to it here, so Slate
       falls back to the demo line. That is the fallback working. -->
  <script src="../station-state-bridge.js?v=0.7.0" defer></script>
  <!-- The recipes bridge (the line's saved recipes) and the weight-profiles
       bridge (its saved receiver weights). No producer here, so the Recipe
       Book and the Weight Profiles say "Not connected". -->
  <script src="../station-recipes-bridge.js?v=0.3.0" defer></script>
  <script src="../station-weight-profiles-bridge.js?v=0.1.0" defer></script>
  <!-- The line connection bridge and the admin bridge: no producer here,
       so the RT Sync trigger stays hidden. -->
  <script src="../station-connection-bridge.js?v=0.2.0" defer></script>
  <script src="../station-admin-bridge.js?v=0.5.0" defer></script>

  <!-- Slate's own layer, in the same order the application host loads it. -->

  <script src="../station/station-print-sheet.js?v=0.1.0" defer></script>
  <!-- The application's own arithmetic, pure, that the tools run: Resin
